name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Enforce source-file size budget
        run: |
          # 1400-line budget. Tracked exceptions (shrink via follow-up splits):
          # internal/convert/convert.go (monolith-refactor R8, blocked on PR #141),
          # internal/pool/pool.go (documented follow-up), and
          # internal/runs/runs.go (documented follow-up split task).
          bad=$(find internal cmd -name '*.go' ! -name '*_test.go' \
            ! -path 'internal/convert/convert.go' \
            ! -path 'internal/pool/pool.go' \
            ! -path 'internal/runs/runs.go' \
            -exec sh -c 'for f; do [ "$(wc -l < "$f")" -gt 1400 ] && echo "$f $(wc -l < "$f")"; done' sh {} +)
          if [ -n "$bad" ]; then echo "Files over 1400 lines:"; echo "$bad"; exit 1; fi

      - name: Test (race detector)
        run: go test -race -timeout 10m ./...

      - name: Verify modules
        run: go mod verify
