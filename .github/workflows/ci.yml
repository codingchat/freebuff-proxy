name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...


      - name: Test (race detector)
        run: go test -race -timeout 10m ./...

      - name: Verify modules
        run: go mod verify
