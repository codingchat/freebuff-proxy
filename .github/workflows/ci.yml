name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Enforce source-file size budget
        run: |
          # 1400-line budget. Tracked exceptions (shrink via follow-up splits):
          # internal/convert/convert.go (monolith-refactor R8, blocked on PR #141),
          # internal/pool/pool.go (documented follow-up), and
          # internal/runs/runs.go (documented follow-up split task).
          # find -exec sh -c returns the LAST sh's exit status; with `set -e`
          # a clean tree (all files under budget, [ ... ] exits 1) would fail
          # the assignment, so `|| true` is required to collect the list.
          bad=$(find internal cmd -name '*.go' ! -name '*_test.go' \
            ! -path 'internal/convert/convert.go' \
            ! -path 'internal/pool/pool.go' \
            ! -path 'internal/runs/runs.go' \
            -exec sh -c 'for f; do [ "$(wc -l < "$f")" -gt 1400 ] && echo "$f $(wc -l < "$f")"; done' sh {} + || true)
          if [ -n "$bad" ]; then echo "Files over 1400 lines:"; echo "$bad"; exit 1; fi

      - name: Test (race detector)
        run: go test -race -timeout 10m ./...

      - name: Verify modules
        run: go mod verify

  # Reproduce the embedded dashboard bundle from source and fail when the
  # committed internal/dashboard/dist is stale (the SPA is go:embed'd, so a
  # stale bundle sails silently into the binary).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - name: Verify committed dashboard bundle is fresh
        run: git diff --exit-code -- internal/dashboard/dist
