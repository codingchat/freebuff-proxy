# fp-bridge deployment configuration

services:
  fp-bridge:
    build: .
    image: fp-bridge:latest
    container_name: fp-bridge
    env_file: .env
    environment:
      - LISTEN_ADDR=:3457
    ports:
      - "3457:3457"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
